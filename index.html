<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Pac-Man en JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pac-Man</h1>
  
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <!-- Panel Game Over -->
  <div id="gameOverPanel" class="oculto">
    <h2>¡GAME OVER!</h2>
    <p>Tu puntuación: <span id="puntajeFinal">0</span></p>
    <input type="text" id="nombreJugador" placeholder="Ingresa tu nombre" maxlength="10">
    <button id="btnGuardar">Guardar Puntaje</button>
    <button id="btnReiniciar" class="btn-reiniciar"> Jugar de Nuevo</button>
  </div>

  <!-- Controles Táctiles para Celular -->
  <div class="controles-tactiles">
    <div class="fila">
      <button class="btn-dpad" id="btnArriba">▲</button>
    </div>
    <div class="fila">
      <button class="btn-dpad" id="btnIzquierda">◀</button>
      <button class="btn-dpad btn-stop" id="btnParar">⏹</button>
      <button class="btn-dpad" id="btnDerecha">▶</button>
    </div>
    <div class="fila">
      <button class="btn-dpad" id="btnAbajo">▼</button>
    </div>
  </div>
<!-- Botón para abrir la tienda -->
<div style="text-align: center; margin-top: 15px;">
  <button id="btnAbrirTienda" class="btn-tienda">🛒 Tienda de Skins</button>
</div>

<!-- Ventana Modal de la Tienda -->
<div id="modalTienda" class="modal-tienda oculto">
  <div class="contenido-tienda">
    <span id="btnCerrarTienda" class="cerrar">&times;</span>
    <h2>🛒 Tienda de Skins</h2>
    <p>Monedas disponibles: <strong id="monedasTienda">0</strong> 🪙</p>
    
    <div id="catalogoContenedor" class="grid-skins">
      <!-- Las skins se generarán dinámicamente con JavaScript -->
    </div>
  </div>
</div>
  <!-- Tabla de Posiciones -->
  <div class="tabla-contenedor">
    <h3> Top 5 Global </h3>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Puntos</th>
        </tr>
      </thead>
      <tbody id="tablaPuntajes">
      </tbody>
    </table>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
