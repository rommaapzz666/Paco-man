<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Pac-Man en JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pac-Man</h1>
  
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div id="gameOverPanel" class="oculto">
    <h2>¡GAME OVER!</h2>
    <p>Tu puntuación: <span id="puntajeFinal">0</span></p>
    <input type="text" id="nombreJugador" placeholder="Ingresa tu nombre" maxlength="10">
    <button id="btnGuardar">Guardar Puntaje</button>
  </div>

  <div class="tabla-contenedor">
    <h3>🏆 Top 5 Global de Amigos</h3>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Puntos</th>
        </tr>
      </thead>
      <tbody id="tablaPuntajes">
      </tbody>
    </table>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
